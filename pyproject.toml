[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latcf"
version = "1.0.4"
description = "Cloudflare Challenger — Turnstile auto-solver, Managed Challenge bypass & human-like cursor"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "ilat"},
]
keywords = ["cloudflare", "turnstile", "bypass", "patchright", "browser", "automation", "cursor", "cf-challenger"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "patchright>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/LATstudio-WeFun/lat-cf-challenger"
Repository = "https://github.com/LATstudio-WeFun/lat-cf-challenger"
Issues = "https://github.com/LATstudio-WeFun/lat-cf-challenger/issues"

[tool.setuptools.packages.find]
include = ["latcf*"]
